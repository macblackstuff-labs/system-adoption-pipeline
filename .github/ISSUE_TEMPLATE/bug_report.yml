name: Bug report
description: The skill or its script gave a wrong result, crashed, or would not install.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security problems go through [private vulnerability reporting](https://github.com/macblackstuff-labs/system-adoption-pipeline/security/advisories/new), never a public issue.
  - type: input
    id: version
    attributes:
      label: Version
      description: Release tag or commit you ran.
      placeholder: v0.2.0
    validations:
      required: true
  - type: dropdown
    id: agent
    attributes:
      label: Agent
      description: Where the skill ran.
      options:
        - Claude Code
        - Codex
        - Cursor
        - Gemini CLI
        - GitHub Copilot
        - OpenCode
        - Script run directly
        - Other
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      description: Output of `python3 --version`.
      placeholder: Python 3.12.4
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What went wrong, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: The smallest input that shows the problem, and the exact command or prompt you used.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: Full script output or error, pasted as text.
      render: text
