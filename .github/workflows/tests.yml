name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.x"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: self-check
        working-directory: skills/system-adoption-pipeline
        run: |
          python3 scripts/test_check_plan.py
          python3 -O scripts/test_check_plan.py
      - name: standard library only
        working-directory: skills/system-adoption-pipeline
        run: |
          imports=$(grep -hE '^(import|from) ' scripts/check_plan.py scripts/interface_matrix.py | sort -u)
          echo "$imports"
          if echo "$imports" | grep -vE '^(import|from) (argparse|graphlib|re|sys)\b'; then
            echo "::error::a third-party import is a defect: standard library only"
            exit 1
          fi

  pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: the vendored interface_matrix.py must match its sha256 pin
        working-directory: skills/system-adoption-pipeline
        run: |
          pinned=$(awk '$1 == "sha256" { print $2 }' scripts/interface_matrix.UPSTREAM)
          actual=$(sha256sum scripts/interface_matrix.py | cut -d' ' -f1)
          echo "pinned $pinned"
          echo "actual $actual"
          if [ "$pinned" != "$actual" ]; then
            echo "::error::scripts/interface_matrix.py no longer matches the pin in scripts/interface_matrix.UPSTREAM"
            exit 1
          fi

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - name: install the Agent Skills reference validator
        run: |
          # bump: git ls-remote https://github.com/agentskills/agentskills main
          sha=69ef37e9424c0a7ea9dd2293b559e43ec8176379
          git clone https://github.com/agentskills/agentskills "$RUNNER_TEMP/agentskills"
          git -C "$RUNNER_TEMP/agentskills" checkout "$sha"
          pip install "$RUNNER_TEMP/agentskills/skills-ref"
      - name: skills-ref validate
        run: skills-ref validate skills/system-adoption-pipeline

  emails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: every commit must use a GitHub noreply email
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -eu
          # The script itself handles an empty/all-zero base (new branch or forced push) by
          # checking the head commit alone, and a base this checkout does not have.
          if [ -z "$BASE" ]; then
            .github/scripts/check-commit-emails.sh "$HEAD"
          else
            .github/scripts/check-commit-emails.sh "$BASE" "$HEAD"
          fi

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - name: install with the skills CLI and run the skill from the installed copy
        run: |
          .github/scripts/smoke-install.sh claude-code codex cursor gemini-cli \
            github-copilot opencode
