name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Lint workflows
        shell: bash
        run: |
          set -euo pipefail
          version="1.7.7"
          os=$(uname -s | tr '[:upper:]' '[:lower:]')
          arch=$(uname -m)
          case "$arch" in
            x86_64) arch="amd64" ;;
            aarch64|arm64) arch="arm64" ;;
          esac
          url="https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_${os}_${arch}.tar.gz"
          curl -fsSL "$url" | tar -xz -C /tmp actionlint
          /tmp/actionlint -color=false .github/workflows/*.yml

      - name: Check markdown relative links
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import os
          import re
          import subprocess
          import sys

          LINK_RE = re.compile(r"!?\[[^\]]*\]\(([^)]+)\)")


          def tracked_md_files():
              result = subprocess.run(
                  ["git", "ls-files", "*.md"],
                  capture_output=True,
                  text=True,
                  check=True,
              )
              return [line.strip() for line in result.stdout.splitlines() if line.strip()]


          CODE_SPAN_RE = re.compile(r"`[^`]*`")


          def is_elided(url):
              stripped = url.strip()
              if not stripped:
                  return True
              for token in stripped.split():
                  if not re.fullmatch(r"[…\.]*(?:…|\.\.+)[…\.]*", token):
                      return False
              return True


          def remove_code(content):
              lines = content.splitlines()
              result = []
              in_code_block = False
              fence = None
              for line in lines:
                  stripped = line.lstrip()
                  if not in_code_block:
                      if stripped.startswith("```") or stripped.startswith("~~~"):
                          in_code_block = True
                          fence = stripped[:3]
                          continue
                      line = CODE_SPAN_RE.sub("", line)
                      result.append(line)
                  else:
                      if stripped.startswith(fence):
                          in_code_block = False
                          fence = None
              return "\n".join(result)


          MACHINE_PATH_PREFIXES = (
              "/Users/", "/home/", "/tmp/", "/var/", "/private/", "/mnt/"
          )


          def is_machine_absolute(url):
              if url.startswith(MACHINE_PATH_PREFIXES):
                  return True
              if len(url) >= 3 and url[1] == ":" and url[2] in ("\\", "/"):
                  return True
              return False


          def check_file(md_path):
              errors = []
              with open(md_path, "r", encoding="utf-8") as f:
                  content = remove_code(f.read())
              base_dir = os.path.dirname(md_path)
              repo_root = os.getcwd()
              for match in LINK_RE.finditer(content):
                  url = match.group(1).strip()
                  if url.startswith("<") and url.endswith(">"):
                      url = url[1:-1].strip()
                  if (
                      url.startswith("http://")
                      or url.startswith("https://")
                      or url.startswith("#")
                      or url.startswith("mailto:")
                      or url.startswith("tel:")
                      or url.startswith("javascript:")
                  ):
                      continue
                  if is_elided(url):
                      continue
                  if is_machine_absolute(url):
                      errors.append(("machine-absolute path in tracked file", url, ""))
                      continue
                  target = url.split("#")[0].split("?")[0]
                  if not target:
                      continue
                  if target.startswith("/"):
                      target_path = os.path.normpath(
                          os.path.join(repo_root, target.lstrip("/"))
                      )
                  else:
                      target_path = os.path.normpath(os.path.join(base_dir, target))
                  if not os.path.exists(target_path):
                      errors.append(("broken relative link", url, target_path))
              return errors


          # A repo may carry markdown whose links point OUTSIDE the repo on purpose --
          # a rules file referencing vault notes it is read alongside, for instance.
          # Those links resolve for their real reader and can never resolve here, so
          # a repo may opt a path out via .github/link-check-ignore (one path per
          # line, `#` comments allowed). Absent file = every tracked .md is checked,
          # which is the behaviour every repo had before this existed.
          IGNORE_FILE = os.path.join(".github", "link-check-ignore")


          def ignored_paths():
              if not os.path.exists(IGNORE_FILE):
                  return set()
              out = set()
              with open(IGNORE_FILE, "r", encoding="utf-8") as f:
                  for line in f:
                      line = line.split("#", 1)[0].strip()
                      if line:
                          out.add(os.path.normpath(line))
              return out


          def main():
              files = tracked_md_files()
              if not files:
                  print("no markdown files tracked")
                  return 0

              skip = ignored_paths()
              # A stale entry is worse than no entry: it silently stops checking a file
              # that was renamed. Name it and fail rather than ignoring it.
              stale = sorted(x for x in skip if not os.path.exists(x))
              if stale:
                  for x in stale:
                      print(f"{IGNORE_FILE}: entry does not exist: {x}", file=sys.stderr)
                  return 1
              if skip:
                  print(f"link check skipping {len(skip)} path(s) per {IGNORE_FILE}")
              files = [f for f in files if os.path.normpath(f) not in skip]

              all_ok = True
              for md in files:
                  errors = check_file(md)
                  if errors:
                      all_ok = False
                      for kind, url, target in errors:
                          if target:
                              print(
                                  f"{md}: {kind} \"{url}\" -> \"{target}\"",
                                  file=sys.stderr,
                              )
                          else:
                              print(
                                  f"{md}: {kind} \"{url}\"",
                                  file=sys.stderr,
                              )

              if all_ok:
                  print(f"checked {len(files)} markdown file(s): all relative links resolve")
              return 0 if all_ok else 1


          sys.exit(main())
          PY

      - name: Validate tracked shell scripts
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do bash -n "$file"; done < <(git ls-files -z '*.sh')

      - name: Lint tracked shell scripts with shellcheck (advisory)
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          files=()
          while IFS= read -r -d '' file; do files+=("$file"); done < <(git ls-files -z '*.sh')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no tracked shell scripts"
            exit 0
          fi
          shellcheck "${files[@]}"

      - name: Validate tracked Python syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do python3 -m py_compile "$file"; done < <(git ls-files -z '*.py')

      # Depth-2, matching the detection in "Run test suite if present" below. Root-only
      # here would skip setup for exactly the repos that change fixed — agentic-loops
      # would get no uv installed and then run `uv run pytest`.
      - name: Set up uv
        if: hashFiles('pyproject.toml', '*/pyproject.toml') != ''
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Set up Node
        if: hashFiles('package.json', '*/package.json') != ''
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0

      # Hooks run under bun, never node (rules/CONVENTIONS.md), so without this every
      # TypeScript check is skipped on the runner. local-claude-super-orchestrator
      # reported "SKIPPED: bun is not installed" and a count of 20 where a local run
      # does 21 — the missing one being the entire TS surface (#17).
      # Depth-unrestricted glob, unlike the manifests above: TS lives wherever the
      # repo puts it (hooks/, src/, scripts/), not next to a package.json.
      - name: Set up bun
        if: hashFiles('**/*.ts') != ''
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Run test suite if present
        shell: bash
        run: |
          set -euo pipefail
          # Detection is depth-2, not root-only. Root-only silently turned every repo
          # whose manifest sits one level down into a 0-tests green: agentic-loops
          # (implementation/pyproject.toml) reported "no test suite" while its 121 tests
          # simply never ran. The pre-migration script used the same find; restoring it.
          #
          # Root is checked EXPLICITLY rather than relying on sort order. `sort | head -1`
          # over find output does NOT put root first -- "./implementation/pyproject.toml"
          # sorts before "./pyproject.toml" ('i' < 'p'), so a repo with both would have run
          # the wrong one. Measured on a fixture, not assumed.
          #
          # And no pipeline at all: `find | sort | head -1` is wrong twice over. It splits
          # a directory name containing a newline into a mangled but NON-EMPTY selection,
          # and `head` closing the pipe SIGPIPEs `sort` under `set -o pipefail`, which
          # exits 141 once the match set outgrows the pipe buffer -- buffer-dependent, so
          # a 300-match probe passes and a 600-match one dies. A glob loop has neither
          # failure mode: bash never word-splits a glob expansion, and there is no pipe.
          find_manifest() {
            if [ -f "./$1" ]; then echo "./$1"; return 0; fi
            local m
            for m in ./*/"$1"; do
              [ -f "$m" ] || continue
              case "$m" in ./node_modules/*|./vendor/*) continue;; esac
              echo "$m"; return 0
            done
            return 0
          }
          pyproject=$(find_manifest pyproject.toml)
          pkgjson=$(find_manifest package.json)
          if [ -n "$pyproject" ]; then
            cd "$(dirname "$pyproject")"
            # No -q here. A repo that wants quiet says so in its own addopts, and when it
            # does, the step's -q STACKED into `-q -q`, which suppresses pytest's summary
            # line entirely -- agentic-loops (addopts = "-q --import-mode=importlib")
            # printed progress dots and no count at all. A run whose test count is
            # invisible is how "0 tests, green" hid for a day. Measured: dropping it
            # restores "206 passed, 2 skipped" there, and costs a repo with no addopts
            # 87 log lines instead of 12 (progress is per-file, not per-test).
            uv run pytest
          elif [ -n "$pkgjson" ]; then
            cd "$(dirname "$pkgjson")"
            placeholder='echo "Error: no test specified" && exit 1'
            test_script=$(node -e "const p=require('./package.json'); const s=p.scripts&&p.scripts.test; process.stdout.write(s||'')")
            if [ -n "$test_script" ] && [ "$test_script" != "$placeholder" ]; then
              npm test
            else
              echo "package.json test script is the npm init placeholder — skipping"
            fi
          else
            echo "no test suite — checks 1–4 ran"
          fi
